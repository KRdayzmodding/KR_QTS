// Создано KR Server Manager — отладочный конфиг по умолчанию
hostname = "{NAME}";                    // Название сервера
password = "";                          // Пароль для входа
passwordAdmin = "";                     // Пароль администратора (#login)
maxPlayers = 10;                        // Максимум игроков (для отладки много не нужно)

verifySignatures = 0;                   // 0 — без проверки подписей (для разработки)
forceSameBuild = 0;                     // Пускать любые сборки клиента
allowFilePatching = 1;                  // Разрешить клиентов с -filePatching (отладка сорсов)

disableVoN = 0;                         // Голосовой чат
vonCodecQuality = 20;

serverTime = "SystemTime";              // Стартовое время
serverTimeAcceleration = 1;             // Ускорение времени
serverTimePersistent = 0;               // Не сохранять время между рестартами

guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;

enableDebugMonitor = 1;                 // Отладочный монитор персонажа
steamQueryPort = 2305;

class Missions
{
    class DayZ
    {
        template = "{MISSION}";         // Миссия по умолчанию (перекрывается ключом -mission)
    };
};
